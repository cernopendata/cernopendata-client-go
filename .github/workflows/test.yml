name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Unit Tests
      run: make test

    - name: Verify Build
      run: make build

    - name: Verify Cross-Platform Builds
      run: make build-all

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Integration Tests
      run: make test-integration

  test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true
    - run: go mod download
    - run: make test
    - run: make build
    - run: make build-all

  integration-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true
    - run: go mod download
    - run: make test-integration
